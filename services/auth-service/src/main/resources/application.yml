spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecomarket_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:ecomarket_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8081}

# El secreto JWT NO tiene valor por defecto: debe inyectarse por variable de
# entorno JWT_SECRET. Si falta, el servicio no arranca (fail-fast). Así se evita
# que un secreto embebido en el repositorio permita firmar tokens válidos.
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
