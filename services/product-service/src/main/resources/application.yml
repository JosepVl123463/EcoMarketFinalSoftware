spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecomarket_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:ecomarket_password}
  jpa:
    hibernate:
      ddl-auto: update
    # show-sql desactivado: evita volcar parámetros de consultas (datos) a los logs.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8082}

# El secreto JWT NO tiene valor por defecto (fail-fast): debe venir de JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}

services:
  audit:
    url: ${AUDIT_SERVICE_URL:http://audit-service:8084}
